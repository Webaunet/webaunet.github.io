<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B5472B">
<link rel="manifest" href="manifest.json"><link rel="icon" href="ic192.png">
<title>Mes recettes</title>
<style>
:root{--bg:#F7F1E8;--ink:#2B2118;--acc:#B5472B;--mut:#7a6c5d;--card:#fff;--line:#e4d9c9}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{position:sticky;top:0;background:var(--acc);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:5}
header h1{font-size:18px;margin:0;flex:1}header button{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:120px}label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px;color:var(--mut)}
main{padding:12px;max-width:640px;margin:auto}
.card{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden;cursor:pointer}
.card img{width:84px;height:84px;object-fit:cover}.card .t{padding:8px 10px;flex:1}.card b{display:block}.card small{color:var(--mut)}
.ph{width:84px;height:84px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:30px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:32px;box-shadow:0 3px 10px #0004}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;margin:6px 6px 0 0}
.btn.g{background:#fff;color:var(--acc);border:1px solid var(--acc)}.btn.r{background:#8a1f1f}
.hero{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.tag{display:inline-block;background:var(--line);border-radius:20px;padding:2px 10px;margin:2px 4px 2px 0;font-size:13px}
ul.ing{padding-left:20px}ul.ing li{margin:4px 0}ol.st li{margin:8px 0}
.chk{list-style:none;padding:0}.chk li{padding:6px 0;display:flex;gap:8px;align-items:flex-start}
#st{font-size:12px;opacity:.85;position:fixed;left:12px;bottom:6px;color:var(--mut)}
.row{display:flex;gap:8px}.row>*{flex:1}
</style></head><body>
<header><button id="back" hidden>←</button><h1 id="ttl">Mes recettes</h1><button id="menu" title="Sauvegarde">⋮</button></header>
<main id="app"></main><div id="st"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let db,all=[],q='',onlyFav=false;
const open=()=>new Promise((ok,ko)=>{const r=indexedDB.open('recettes',1);r.onupgradeneeded=()=>r.result.createObjectStore('r',{keyPath:'id'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>ko(r.error)});
const tx=(m)=>db.transaction('r',m).objectStore('r');
const rq=r=>new Promise((ok,ko)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const load=async()=>{all=(await rq(tx('readonly').getAll())).sort((a,b)=>b.u-a.u)};
const put=async r=>{r.u=Date.now();await rq(tx('readwrite').put(r));await load()};
const del=async id=>{await rq(tx('readwrite').delete(id));await load()};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const lines=s=>(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const urls=new Map();const imgUrl=r=>{if(!r.img)return'';if(!urls.has(r.id+r.u))urls.set(r.id+r.u,URL.createObjectURL(r.img));return urls.get(r.id+r.u)};
function shrink(file){return new Promise(ok=>{const i=new Image();i.onload=()=>{const m=1000,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(ok,'image/jpeg',.8)};i.src=URL.createObjectURL(file)})}
function setHead(t,back){$('#ttl').textContent=t;$('#back').hidden=!back}
$('#back').onclick=()=>history.length>1?history.back():(location.hash='');
window.onhashchange=route;
function route(){const h=location.hash.slice(1);if(h==='new')return form();if(h.startsWith('e/'))return form(h.slice(2));if(h.startsWith('r/'))return view(h.slice(2));list()}
function list(){setHead('Mes recettes',false);
 const t=fold(q).split(/\s+/).filter(Boolean);
 const rs=all.filter(r=>(!onlyFav||r.fav)&&t.every(w=>fold([r.title,r.tags,r.ing,r.steps].join(' ')).includes(w)));
 app.innerHTML=`<input id="s" type="search" placeholder="Rechercher (titre, ingrédient, étiquette)…" value="${esc(q)}">
 <label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="fv" ${onlyFav?'checked':''} style="width:auto"> Favoris seulement</label>
 ${rs.map(r=>`<div class="card" data-id="${r.id}">${r.img?`<img src="${imgUrl(r)}">`:'<div class="ph">🍲</div>'}<div class="t"><b>${r.fav?'★ ':''}${esc(r.title)}</b><small>${[r.time&&r.time+' min',r.serv&&r.serv+' pers.'].filter(Boolean).join(' · ')}</small><br>${(r.tags||'').split(',').filter(x=>x.trim()).map(x=>`<span class="tag">${esc(x.trim())}</span>`).join('')}</div></div>`).join('')||`<p style="color:var(--mut);text-align:center;margin-top:40px">${all.length?'Aucun résultat.':'Aucune recette. Appuie sur + pour commencer.'}</p>`}
 <button class="fab" onclick="location.hash='new'">+</button>`;
 const s=$('#s');s.oninput=()=>{q=s.value;const p=s.selectionStart;list();$('#s').focus();$('#s').setSelectionRange(p,p)};
 $('#fv').onchange=e=>{onlyFav=e.target.checked;list()};
 app.querySelectorAll('.card').forEach(c=>c.onclick=()=>location.hash='r/'+c.dataset.id)}
function view(id){const r=all.find(x=>x.id===id);if(!r)return location.hash='';setHead(r.title,true);
 app.innerHTML=`${r.img?`<img class="hero" src="${imgUrl(r)}">`:''}
 <p>${[r.time&&'⏱ '+r.time+' min',r.serv&&'👥 '+r.serv+' pers.'].filter(Boolean).join(' · ')} ${(r.tags||'').split(',').filter(x=>x.trim()).map(x=>`<span class="tag">${esc(x.trim())}</span>`).join('')}</p>
 <h3>Ingrédients</h3><ul class="chk">${lines(r.ing).map(l=>`<li><input type="checkbox" style="width:auto;margin-top:5px"><span>${esc(l)}</span></li>`).join('')}</ul>
 <h3>Préparation</h3><ol class="st">${lines(r.steps).map(l=>`<li>${esc(l)}</li>`).join('')}</ol>
 ${r.note?`<h3>Notes</h3><p>${esc(r.note).replace(/\n/g,'<br>')}</p>`:''}
 <button class="btn" onclick="location.hash='e/${r.id}'">Modifier</button>
 <button class="btn g" id="fv2">${r.fav?'★ Retirer des favoris':'☆ Favori'}</button>
 <button class="btn r" id="dl">Supprimer</button>`;
 $('#fv2').onclick=async()=>{r.fav=!r.fav;await put(r);view(id)};
 $('#dl').onclick=async()=>{if(confirm('Supprimer cette recette ?')){await del(id);location.hash=''}};
 try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}}
function form(id){const r=all.find(x=>x.id===id)||{id:crypto.randomUUID(),title:'',tags:'',ing:'',steps:'',note:'',time:'',serv:''};
 setHead(id?'Modifier':'Nouvelle recette',true);let blob=r.img,gone=false;
 app.innerHTML=`<label>Titre</label><input id="f_t" value="${esc(r.title)}">
 <div class="row"><div><label>Durée (min)</label><input id="f_m" type="number" inputmode="numeric" value="${esc(r.time)}"></div><div><label>Personnes</label><input id="f_p" type="number" inputmode="numeric" value="${esc(r.serv)}"></div></div>
 <label>Étiquettes (séparées par des virgules)</label><input id="f_g" value="${esc(r.tags)}">
 <label>Ingrédients (un par ligne)</label><textarea id="f_i">${esc(r.ing)}</textarea>
 <label>Préparation (une étape par ligne)</label><textarea id="f_s">${esc(r.steps)}</textarea>
 <label>Notes</label><textarea id="f_n" style="min-height:70px">${esc(r.note)}</textarea>
 <label>Photo</label><input id="f_f" type="file" accept="image/*"><div id="pv"></div>
 <button class="btn" id="ok">Enregistrer</button>`;
 const pv=()=>{$('#pv').innerHTML=blob?`<img class="hero" style="margin-top:8px" src="${URL.createObjectURL(blob)}"><br><button class="btn g" id="rm">Retirer la photo</button>`:'';if(blob)$('#rm').onclick=()=>{blob=null;pv()}};pv();
 $('#f_f').onchange=async e=>{if(e.target.files[0]){blob=await shrink(e.target.files[0]);pv()}};
 $('#ok').onclick=async()=>{const t=$('#f_t').value.trim();if(!t)return alert('Titre requis');
  Object.assign(r,{title:t,time:$('#f_m').value,serv:$('#f_p').value,tags:$('#f_g').value,ing:$('#f_i').value,steps:$('#f_s').value,note:$('#f_n').value,img:blob||null});
  await put(r);history.replaceState(null,'','#r/'+r.id);route()}}
// Sauvegarde
const b64=b=>new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result);f.readAsDataURL(b)});
$('#menu').onclick=async()=>{const c=prompt('1 = Exporter (JSON)\n2 = Importer (JSON)','1');
 if(c==='1'){const d=await Promise.all(all.map(async r=>({...r,img:r.img?await b64(r.img):null})));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,recettes:d})],{type:'application/json'}));a.download='recettes-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
 if(c==='2')$('#imp').click()};
$('#imp').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());let n=0;
 for(const r of j.recettes||[]){if(r.img)r.img=await (await fetch(r.img)).blob();await rq(tx('readwrite').put(r));n++}
 await load();alert(n+' recette(s) importée(s)');route()}catch(x){alert('Fichier invalide')}e.target.value=''};
(async()=>{await open();await load();route();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(()=>$('#st').textContent='');
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 addEventListener('offline',()=>$('#st').textContent='Hors ligne');addEventListener('online',()=>$('#st').textContent='')})();
</script></body></html>
